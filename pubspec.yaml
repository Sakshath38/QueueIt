name: branch_q
description: Branch services and digital queue management application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core routing and state management used in the code
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  # Standard Cupertino icons (often required by Material components internally)
  cupertino_icons: ^1.0.6

  google_fonts: ^6.2.1      # Premium typography
  lucide_icons_flutter: 3.1.20      # Modern, clean line-icons
  flutter_animate: ^4.5.0   # Dead-simple, gorgeous micro-interactions
  
  # Production Network & Utilities
  dio: ^5.4.1
  uuid: ^4.3.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Standard linting rules for Flutter
  flutter_lints: ^3.0.0

flutter:
  # Ensures Material icons and fonts are included
  uses-material-design: true

